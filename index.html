    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is ProductTasks?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ProductTasks is an AI-powered platform that helps aspiring product managers prepare for PM interviews. It offers 600+ real interview questions with AI-generated feedback on your answers, covering frameworks like CIRCLES, AARM, and STAR."
            }
          },
          {
            "@type": "Question",
            "name": "How does the AI mock interview work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You speak your answer to a PM interview question, and our AI transcribes your response in real-time. It then provides detailed feedback on clarity, content quality, completeness, and PM framework application."
            }
          },
          {
            "@type": "Question",
            "name": "What PM frameworks does ProductTasks cover?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ProductTasks helps you master essential PM frameworks including CIRCLES (Comprehend, Identify, Report, Cut, List, Evaluate, Summarize), AARM (Acquire, Activate, Retain, Monetize), and STAR (Situation, Task, Action, Result) among others."
            }
          },
          {
            "@type": "Question",
            "name": "Is ProductTasks free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, ProductTasks offers a free plan with limited AI mock interviews, sample questions, and basic feedback. Paid plans start at ₹800 per month for 50 AI interviews with full feedback and access to all 600+ questions."
            }
          },
          {
            "@type": "Question",
            "name": "What types of PM interview questions are covered?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ProductTasks covers six categories of PM interview questions: Product Design, Strategy, Metrics, Estimation, Behavioral, and Technical questions — the same categories used by top tech companies like Google, Meta, Amazon, and Microsoft."
            }
          }
        ]
