services:
  - type: web
    name: producttasks-api
    env: python
    buildCommand: pip install --only-binary :all: -r requirements.txt || pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_DOMAIN
        value: producttasks.com
